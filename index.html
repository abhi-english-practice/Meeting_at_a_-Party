<script type="application/json" id="lesson-data">{"cards": [{"title": "I’m Todd (Jones)", "ipa": "/aɪm tɑd/", "color": 0, "sid": 4, "phrase": "I’m Todd", "kind": "Introduction", "notes": ["Simply using I’m and then saying your name is one way to introduce yourself. You could also say, for example, My name’s Todd (Jones). It is customary to offer your right hand in a handshake to the other person. In very informal situations, you could just say Hi, I’m Todd, with no handshake. To introduce one or more people other than yourself, say:", "This is (my wife,) Mary. And this is Susan, Bob, and Joe.", "To introduce more than one person and also tell how you know them, say:", "These are my friends, Susan and Bob. And this is Jim, my\ncoworker.", "All of the people introduced would then shake hands. You could also say:", "I want you to meet (my friends,) Susan and Bob."], "extra": "", "gloss": "Mình là Todd (Jones)", "notesVi": ["Chỉ cần nói “I’m” rồi đến tên mình là một cách tự giới thiệu. Bạn cũng có thể nói “My name’s Todd (Jones).” Theo thông lệ, bạn có thể đưa tay phải ra bắt tay người đối diện. Trong tình huống rất thân mật, chỉ cần chào “Hi, I’m Todd” mà không cần bắt tay.", "Để giới thiệu một hoặc nhiều người khác, bạn có thể nói “Đây là Mary, vợ tôi. Còn đây là Susan, Bob và Joe.” Nếu muốn nói rõ mối quan hệ, hãy nói “Đây là hai người bạn của tôi, Susan và Bob. Còn đây là Jim, đồng nghiệp của tôi.” Sau khi được giới thiệu, mọi người thường bắt tay nhau. Bạn cũng có thể nói “Tôi muốn giới thiệu với bạn hai người bạn của tôi, Susan và Bob.”"]}, {"title": "Glad/happy to meet you", "ipa": "/ɡlæd tə mit ju/ · /ˈhæpi tə mit ju/", "color": 1, "sid": 5, "phrase": "Glad to meet you", "kind": "Greeting", "notes": ["When you have been introduced to someone, it is customary to say (I’m) glad/happy to meet you or It’s nice to meet you. The reply is I’m happy to meet you or I’m happy to meet you, too. (The underlined words are pronounced slightly louder than the others.)"], "extra": "In the reply, stress “happy” or “too,” depending on the wording.\n\n— Glad to meet you.\n— I’m happy to meet you, too.", "gloss": "Rất vui được gặp bạn", "notesVi": ["Khi được giới thiệu với ai đó, người ta thường nói “Rất vui được gặp bạn”, chẳng hạn “(I’m) glad/happy to meet you” hoặc “It’s nice to meet you”. Bạn có thể đáp “Mình rất vui được gặp bạn” hoặc “Mình cũng rất vui được gặp bạn”. Những từ được gạch chân trong sách được nhấn rõ hơn. Tùy cách đáp, hãy nhấn “happy” hoặc “too”.", "— Rất vui được gặp bạn.\n— Mình cũng rất vui được gặp bạn."]}, {"title": "Right?", "ipa": "/raɪt/", "color": 0, "sid": 0, "phrase": "right?", "kind": "Confirmation", "notes": ["Right? is an informal way to ask for confirmation that what you have just said is true. The answer can be That’s right!"], "extra": "— This train goes to Washington, right?\n— That’s right.\n\n— You’re from Panama, right?\n— That’s right, I am.", "gloss": "Đúng không? / Phải không?", "notesVi": ["Thêm “Right?” ở cuối câu là cách hỏi thân mật để xác nhận điều mình vừa nói có đúng không. Người nghe có thể đáp “That’s right!” (Đúng rồi!).", "— Tàu này đi Washington, đúng không?\n— Đúng rồi.", "— Bạn đến từ Panama, phải không?\n— Đúng, mình đến từ Panama."]}, {"title": "Correct!", "ipa": "/kəˈrɛkt/", "color": 1, "sid": 2, "phrase": "Correct!", "kind": "Confirmation", "notes": ["This is an informal answer to a question that asks for confirmation.", "If you want to tell your questioner that he or she is not correct, you can politely say this with, for example:", "No, that’s not right.\nNo, that’s not correct.\nNo, I’m not Matt; I’m Jim.\nNo, she isn’t my sister. She’s my cousin.", "(The underlined words in the examples should be spoken slightly louder than the other words in the sentence.) To sarcastically indicate that something is not correct, Yeah, right! is used."], "extra": "— You’re Matt, aren’t you?\n— Correct!\n\n— This is Economics 101, right?\n— Correct!\n\n— Dylan, I heard you just won the lottery jackpot!\n— Yeah, right! Where did you hear that nonsense?", "gloss": "Đúng rồi!", "notesVi": ["“Correct!” là cách đáp thân mật khi có người hỏi để xác nhận thông tin. Nếu người hỏi nhầm, bạn có thể đính chính lịch sự như “Không, không đúng đâu”, “Không, mình không phải Matt. Mình là Jim” hoặc “Không, cô ấy không phải chị em ruột của mình. Cô ấy là chị em họ”. Hãy nhấn rõ những từ được gạch chân trong ví dụ của sách. Giọng mỉa mai trong “Yeah, right!” có thể mang nghĩa “Ừ, tin được mới lạ!”", "— Bạn là Matt, phải không? — Đúng rồi!\n— Đây là lớp Nhập môn Kinh tế, đúng không? — Đúng rồi!\n— Dylan, nghe nói cậu vừa trúng độc đắc! — Ừ, tin được mới lạ! Cậu nghe chuyện vớ vẩn đó ở đâu thế?"]}, {"title": "Am, do, etc.", "ipa": "/æm/ · /du/", "color": 0, "sid": 9, "phrase": "I do like parties", "kind": "Grammar", "notes": ["When a yes-or-no question using the verb to be is asked, the answer can be made emphatic by following it with a tag, in which, if the answer is yes, the verb is said a little louder than the other words. Affirmative tag answers are not contracted.", "When the answer is no, there are two ways to answer with a tag. The underlined words are the ones said a little louder. Negative tag answers are usually contracted. The full form makes them more emphatic.", "When an information question using any verb other than to be is asked, the answer can be made emphatic by following it with a tag, in which the verb is said a little louder than the other words."], "extra": "With “be”\nAre you unhappy? → Yes, I am. / No, I’m not. / No, I am not.\nIs he sick? → Yes, he is. / No, he’s not. / No, he isn’t. / No, he is not.\nAre we winning? → Yes, we are. / No, we’re not. / No, we aren’t. / No, we are not.\nAre they leaving? → Yes, they are. / No, they’re not. / No, they aren’t. / No, they are not.\n\nWith “do”\nDo you eat meat? → Yes, I do. / No, I don’t. / No, I do not.\nDoes he like school? → Yes, he does. / No, he doesn’t. / No, he does not.\nDo we wait in line? → Yes, we do. / No, we don’t. / No, we do not.\nDo they live here? → Yes, they do. / No, they don’t. / No, they do not.\n\nIn the conversation, Todd also stresses “do” inside the affirmative statement “I do like parties.”", "gloss": "Nhấn trợ động từ trong câu trả lời ngắn", "notesVi": ["Với câu hỏi có–không dùng “be”, câu trả lời khẳng định ngắn nhấn vào động từ và dùng dạng đầy đủ, chẳng hạn “Yes, I am”. Câu trả lời phủ định thường dùng dạng rút gọn. Dùng dạng đầy đủ để nhấn mạnh hơn. Với câu hỏi có–không dùng “do/does”, nhấn rõ trợ động từ trong câu đáp.", "Với “be”\nBạn không vui à? — Có, mình không vui. / Không, mình vẫn vui.\nAnh ấy bị ốm à? — Phải. / Không.\nChúng ta đang thắng à? — Phải. / Không.\nHọ sắp rời đi à? — Phải. / Không.", "Với “do/does”\nBạn có ăn thịt không? — Có. / Không.\nCậu ấy có thích đi học không? — Có. / Không.\nChúng ta có phải xếp hàng không? — Có. / Không.\nHọ có sống ở đây không? — Có. / Không.", "Trong bài, Todd còn nhấn “do” trong câu khẳng định “I do like parties” để nói rằng mình thực sự thích tiệc tùng."]}, {"title": "As a matter of fact", "ipa": "/æz ə ˈmætɚ əv fækt/", "color": 1, "sid": 9, "phrase": "as a matter of fact", "kind": "Expression", "notes": ["As a matter of fact is a common expression that has a number of different meanings. In our example conversation it introduces a confirmation of what was previously said. It can go before the main clause or after the verb.", "You can express the same meaning with actually, but put it after the verb."], "extra": "— I heard you were looking for a job.\n— As a matter of fact, I am! / I am, actually.\n\n— Your friend is very good-looking. Is he single?\n— He is, as a matter of fact!\n\n— Your friend is beautiful, but I’ll bet she’s married.\n— She is, actually.", "gloss": "Thật ra / Quả đúng là", "notesVi": ["“As a matter of fact” là một cụm thông dụng có nhiều nghĩa. Trong hội thoại này, nó xác nhận điều vừa nói. Cụm này có thể đứng trước mệnh đề chính hoặc sau động từ. Trong các ví dụ của sách, “actually” diễn đạt cùng ý và đứng sau động từ.", "— Nghe nói bạn đang tìm việc. — Đúng, mình đang tìm thật!\n— Bạn của cậu đẹp trai quá. Anh ấy còn độc thân không? — Anh ấy đúng là còn độc thân!\n— Bạn cậu đẹp thật, nhưng mình đoán cô ấy lấy chồng rồi. — Đúng là cô ấy lấy chồng rồi."]}, {"title": "Just", "ipa": "/dʒʌst/", "color": 0, "sid": 3, "phrase": "just", "kind": "Adverb", "notes": ["This use of just indicates that something happened only a short time before. It can be used with the past tense or with the present perfect tense. For example:"], "extra": "Past simple → Present perfect\nI just arrived. → I have just arrived.\nThey just finished. → They have just finished.\nWe just ate. → We have just eaten.\nHe just called. → He has just called.", "gloss": "Vừa mới", "notesVi": ["“Just” trong cách dùng này cho biết sự việc xảy ra cách đây rất ít lâu. Có thể dùng với quá khứ đơn hoặc hiện tại hoàn thành.", "Các cặp ví dụ trong sách lần lượt có nghĩa là “Mình vừa đến”, “Họ vừa làm xong”, “Chúng mình vừa ăn xong” và “Anh ấy vừa gọi”."]}, {"title": "To get in", "ipa": "/ɡɛt ɪn/", "color": 1, "sid": 3, "phrase": "got in", "kind": "Phrasal verb", "notes": ["To get in means to arrive and is usually used in the past tense.", "What time did you get in?\nThey got in late last night.", "Another way to say to arrive, when it refers to the future, is to get there.", "I hope we get there on time.\nShe will get there by six.", "To get in can also mean to be accepted by a school/college/university or other group with limited membership.", "He applied to that college and really hopes to get in.\nShe didn’t get in her first choice of sororities, but she got in another one, and she’s happy."], "extra": "", "gloss": "Đến nơi", "notesVi": ["“To get in” có nghĩa là đến nơi và thường dùng ở thì quá khứ. “What time did you get in?” nghĩa là “Bạn đến lúc mấy giờ?”. “They got in late last night” nghĩa là “Họ đến muộn tối qua”.", "Khi nói đến việc sẽ tới một nơi, có thể dùng “get there”. Hai ví dụ trong sách nghĩa là “Mình hy vọng chúng ta tới đó đúng giờ” và “Cô ấy sẽ tới đó chậm nhất lúc sáu giờ”.", "“Get in” cũng có thể nghĩa là được một trường hoặc một nhóm có số lượng thành viên giới hạn chấp nhận. Anh ấy đã nộp đơn vào trường đó và rất hy vọng được nhận. Cô ấy không vào được hội nữ sinh mình ưu tiên, nhưng đã được một hội khác nhận và cô ấy rất vui."]}, {"title": "I can assure you that . . . /you can be sure (that) . . .", "ipa": "/aɪ kən əˈʃʊr ju ðæt/ · /ju kən bi ʃʊr/", "color": 0, "sid": 6, "phrase": "I can assure you that", "kind": "Reassurance", "notes": ["These are common ways of saying that you believe something to be true, hoping to win the confidence of the person you are talking to.", "I can assure you that I will work hard.\nYou can be sure that something interesting will happen.", "Here is another way to express that you believe something to be true:", "I promise you that we won’t leave until the work is done."], "extra": "", "gloss": "Mình có thể bảo đảm rằng / Bạn cứ yên tâm rằng", "notesVi": ["Đây là hai cách thông dụng để khẳng định điều mình tin là đúng, nhằm tạo sự tin tưởng cho người nghe. Ví dụ, “Mình bảo đảm sẽ làm việc chăm chỉ” và “Bạn cứ yên tâm là sẽ có chuyện thú vị xảy ra”.", "Một cách nói khác là dùng “I promise you that …”, chẳng hạn “Mình hứa cả nhóm sẽ không rời đi cho đến khi xong việc”."]}, {"title": "Party animal", "ipa": "/ˈpɑrti ˌænəməl/", "color": 1, "sid": 8, "phrase": "party animal", "kind": "Informal expression", "notes": ["Party animal is an informal expression used to characterize someone who spends a lot of time with friends or acquaintances for entertainment—either at home or in public places.", "My friend Eric will take you downtown on Saturday night; he’s a real\nparty animal, so you’ll meet lots of people."], "extra": "", "gloss": "Người rất mê tiệc tùng", "notesVi": ["“Party animal” là cách nói thân mật về một người dành nhiều thời gian vui chơi với bạn bè hoặc người quen, dù ở nhà hay ở nơi công cộng.", "Ví dụ, “Bạn mình là Eric sẽ đưa bạn vào trung tâm thành phố tối thứ Bảy. Cậu ấy mê tiệc tùng lắm, nên bạn sẽ gặp rất nhiều người”."]}, {"title": "Extraordinaire", "ipa": "/ɪkˌstrɔrdəˈnɛr/", "color": 0, "sid": 8, "phrase": "extraordinaire", "kind": "Emphasis", "notes": ["Extraordinaire is a word borrowed from French, pronounced in English “ek stra or d- NAYRE.” It is used to exaggerate the meaning of the previous word.", "I’d like you to meet Marc—he’s our pastry chef extraordinaire. You\nhave to try his cheesecake!"], "extra": "", "gloss": "Có hạng / Cực kỳ xuất sắc", "notesVi": ["“Extraordinaire” là từ mượn tiếng Pháp. Khi đặt sau một danh từ, từ này nhấn mạnh rằng người được nhắc đến nổi bật hoặc đặc biệt giỏi. Cách đọc tiếng Anh được ghi ở phần phiên âm của thẻ.", "Ví dụ, “Mình muốn giới thiệu Marc, đầu bếp bánh ngọt xuất sắc của chúng mình. Bạn nhất định phải thử bánh phô mai anh ấy làm!”"]}, {"title": "What do you do?", "ipa": "/wʌt də ju du/", "color": 1, "sid": 10, "phrase": "what you do", "kind": "Question", "notes": ["The question What do you do? asks what one’s job or occupation is. When you answer with a form of to be, you give a general job title. Note that the article a is always used when referring to only one person but is never used when referring to more than one person.", "When the answer refers to someone who has a special title or position (i.e., is the only one in that position), use the instead of a.", "When you answer with another verb, you give more specific information about where you work.", "When a specific time or place is included in the question, the answer refers to how people spend their time, not just what their jobs are."], "extra": "General job titles\nI’m a lawyer. / He’s a painter. / She’s a banker. / They’re professors.\n\nA specific position\nHe’s the president of ABC Enterprises. / I’m the school secretary.\n\nOther verbs can give more detail\nI work for a large firm. / He drives a delivery truck. / She works at Atlas Bank. / They teach French at Loyola.\n\nTime or place\n— What do you do on weekends?\n— I relax and hang out with my friends.\n\n— What does she do at the beach?\n— She surfs, relaxes on the beach, and goes to the boardwalk for fun.", "gloss": "Bạn làm nghề gì?", "notesVi": ["“What do you do?” hỏi về nghề nghiệp. Dùng “be” để nêu nghề. Với một nghề danh từ đếm được ở số ít, dùng “a” hoặc “an”. Khi nói về nhiều người với danh từ số nhiều, bỏ mạo từ này. Các ví dụ lần lượt là “Tôi là luật sư”, “Anh ấy là thợ sơn”, “Cô ấy làm trong ngành ngân hàng” và “Họ là giảng viên”.", "Với một chức vụ cụ thể chỉ có một người đảm nhiệm, dùng “the”, chẳng hạn “Anh ấy là chủ tịch ABC Enterprises” hoặc “Tôi là thư ký của trường”. Dùng động từ khác để nói cụ thể hơn về công việc, chẳng hạn “Tôi làm cho một hãng lớn”, “Anh ấy lái xe tải giao hàng”, “Cô ấy làm tại Ngân hàng Atlas” và “Họ dạy tiếng Pháp ở Loyola”.", "Khi câu hỏi có thời gian hay địa điểm cụ thể, nó cũng có thể hỏi người ta thường làm gì. Ví dụ, “Cuối tuần bạn làm gì?” — “Mình nghỉ ngơi và đi chơi với bạn bè”. Hoặc “Cô ấy làm gì ở bãi biển?” — “Cô ấy lướt sóng, thư giãn trên bãi biển rồi đi dạo trên lối đi ven biển”."]}, {"title": "Tell me about yourself", "ipa": "/tɛl mi əˈbaʊt jɚˈsɛlf/", "color": 0, "sid": 10, "phrase": "tell me more about yourself", "kind": "Invitation", "notes": ["Tell me about yourself is a polite way to let someone know that you are interested in learning more about him or her. It is better than asking direct questions, as the person being asked can decide what to tell and what not to tell. For example:"], "extra": "— Tell me about yourself.\n— Well, I’m twenty-seven, I have a degree in mathematics, and I’ve been working at SYZ Company for three years. My parents are both economists, and I have a sister who’s a nurse and two younger brothers. They all live in Connecticut, where I was born. I’m crazy about football and have season tickets. I listen to reggae, etc.\n\n— Tell me about yourself.\n— Well, I’m from a small town, and I came here to work.", "gloss": "Kể cho mình nghe về bạn nhé", "notesVi": ["Đây là cách lịch sự để bày tỏ rằng bạn muốn hiểu thêm về ai đó. Câu hỏi mở cho người được hỏi tự chọn những điều họ muốn chia sẻ.", "— Kể cho mình nghe về bạn nhé.\n— Mình 27 tuổi, có bằng toán và làm ở Công ty SYZ được ba năm. Cả bố mẹ mình đều là nhà kinh tế học. Mình có một chị gái làm y tá và hai em trai. Họ đều sống ở Connecticut, nơi mình sinh ra. Mình mê bóng bầu dục và có vé cả mùa. Mình nghe nhạc reggae, v.v.", "— Kể cho mình nghe về bạn nhé.\n— Mình đến từ một thị trấn nhỏ và tới đây để làm việc."]}, {"title": "Awesome", "ipa": "/ˈɔsəm/", "color": 1, "sid": 13, "phrase": "awesome", "kind": "Informal adjective", "notes": ["Awesome is an expression that is used a lot—maybe too much!—to say that you think something is really good. Other ways to express the same thing include great, fantastic, terrific, wonderful, and cool."], "extra": "How do you like it here? → It’s awesome!\nDid you like the movie? → It was awesome!\nThank you for taking me—you’re awesome!", "gloss": "Tuyệt lắm", "notesVi": ["“Awesome” là cách nói rất thông dụng để khen điều gì đó thật sự hay hoặc tuyệt vời. Các từ gần nghĩa gồm “great”, “fantastic”, “terrific”, “wonderful” và “cool”.", "Bạn thấy ở đây thế nào? — Tuyệt lắm!\nBạn có thích bộ phim không? — Phim hay tuyệt!\nCảm ơn cậu đã dẫn mình đi. Cậu tuyệt quá!"]}, {"title": "Nonstop schedule", "ipa": "/ˈnɑnˌstɑp ˈskɛdʒuːl/", "color": 0, "sid": 16, "phrase": "a nonstop schedule", "kind": "Noun phrase", "notes": ["Nonstop schedule describes the activities of a very busy person, whether it be because of work, school, family responsibilities, or even social life.", "I don’t have time to see you this week, with my nonstop schedule.", "Other ways to indicate nonstop activity are around-the-clock or twenty- four-seven (twenty-four hours a day, seven days a week).", "I get telephone calls around-the-clock.\nHe works twenty-four-seven, so I hardly ever see him."], "extra": "", "gloss": "Lịch kín mít / Lịch dày đặc", "notesVi": ["“Nonstop schedule” chỉ lịch hoạt động dày đặc do công việc, học hành, trách nhiệm gia đình hoặc các cuộc hẹn xã hội. Ví dụ, “Lịch tuần này kín mít nên mình không có thời gian gặp bạn”.", "“Around-the-clock” và “twenty-four-seven” (24/7) cũng diễn tả việc diễn ra liên tục. Ví dụ, “Mình nhận điện thoại suốt ngày đêm” và “Anh ấy làm việc 24/7 nên mình hầu như chẳng gặp được anh ấy”."]}, {"title": "A mix", "ipa": "/ə mɪks/", "color": 1, "sid": 16, "phrase": "a mix of", "kind": "Noun phrase", "notes": ["A mix refers to a combination of different elements, usually indicating variety.", "There will be a good mix of music at the wedding, to keep the\ngrandparents, the parents, and the young people happy. We invited a mix of people—family, friends, coworkers, and\nneighbors."], "extra": "", "gloss": "Sự kết hợp / Đủ loại", "notesVi": ["“A mix” là sự kết hợp của nhiều thành phần, thường gợi sự đa dạng. Ví dụ, đám cưới sẽ có đủ thể loại nhạc để ông bà, bố mẹ và các bạn trẻ đều thích. Một ví dụ khác là “Chúng tôi mời nhiều nhóm người, gồm gia đình, bạn bè, đồng nghiệp và hàng xóm”."]}, {"title": "Hopefully", "ipa": "/ˈhoʊpfəli/", "color": 0, "sid": 16, "phrase": "hopefully", "kind": "Adverb", "notes": ["Hopefully is a word inserted to indicate your wishes that something will happen. It can come in the middle of a verb phrase (will + hopefully + verb), before the subject, or at the end of a sentence.", "I’ll hopefully graduate in two years.\nHopefully, I’ll graduate in two years.\nI’ll graduate in two years, hopefully.", "If we leave right away, hopefully we’ll arrive on time."], "extra": "", "gloss": "Hy vọng là", "notesVi": ["“Hopefully” cho biết người nói mong điều gì đó xảy ra. Từ này có thể đứng giữa cụm động từ, chẳng hạn “will + hopefully + động từ”, ở đầu câu trước chủ ngữ hoặc ở cuối câu.", "Ba ví dụ đầu đều có nghĩa “Mình hy vọng sẽ tốt nghiệp sau hai năm”. Ví dụ còn lại nghĩa là “Nếu đi ngay, hy vọng chúng ta sẽ đến đúng giờ”."]}, {"title": "A couple of", "ipa": "/ə ˈkʌpəl əv/", "color": 1, "sid": 16, "phrase": "a couple of days", "kind": "Quantity", "notes": ["A couple really means two; however, informally, it can mean more than that —but it does indicate a small number."], "extra": "I’ll see you in a couple of hours. → I’ll see you sometime today.\nIt only costs a couple of dollars. → It costs less than five dollars.\nHe’ll be home in a couple of months. → He’ll be home before the end of the year.\n\nThe alternatives in the book show looser estimates in these examples.", "gloss": "Hai / Một vài", "notesVi": ["“A couple” theo nghĩa đen là hai. Trong giao tiếp thân mật, “a couple of” cũng có thể chỉ một số lượng nhỏ, đôi khi hơn hai.", "Sách đưa ra ba cách diễn đạt lại với khoảng ước lượng rộng hơn. “Hẹn gặp cậu sau vài giờ” thành “Gặp cậu vào lúc nào đó hôm nay”. “Chỉ tốn vài đô” thành “Tốn chưa đến năm đô”. “Anh ấy sẽ về nhà sau vài tháng” thành “Anh ấy sẽ về nhà trước cuối năm”."]}, {"title": "A good guy", "ipa": "/ə ɡʊd ɡaɪ/", "color": 0, "sid": 17, "phrase": "a good guy", "kind": "Informal expression", "notes": ["Calling someone a good guy is a common way to recommend a male as being understanding of someone’s situation, helpful, or generous. A female with the same kind of recommendation would be called understanding/helpful/generous.", "If you’re looking for a used car, go see Sam Smith; he’s a good guy\nand will probably give you a good price. If you want a teaching job, call Mary Johnson; she’s very\nunderstanding and will give you good advice."], "extra": "", "gloss": "Một người tốt bụng / Tử tế", "notesVi": ["“A good guy” là cách nói phổ biến để giới thiệu một người đàn ông biết thông cảm, hay giúp đỡ hoặc rộng rãi. Khi giới thiệu một phụ nữ có các phẩm chất đó, có thể dùng “understanding”, “helpful” hoặc “generous”.", "Ví dụ, nếu muốn mua xe cũ, hãy gặp Sam Smith. Anh ấy tử tế và có lẽ sẽ bán cho bạn với giá tốt. Nếu muốn tìm việc dạy học, hãy gọi Mary Johnson. Cô ấy rất biết thông cảm và sẽ cho bạn lời khuyên hữu ích."]}, {"title": "The local scene", "ipa": "/ðə ˈloʊkəl sin/", "color": 1, "sid": 16, "phrase": "the local scene", "kind": "Noun phrase", "notes": ["The local scene refers to the culture and range of entertainment offered in a particular area."], "extra": "— I’m moving to Springfield next month. What’s the local scene like there?\n— Oh, it’s great! There are lots of things to do at night and on weekends.", "gloss": "Đời sống và các chỗ vui chơi ở địa phương", "notesVi": ["“The local scene” chỉ văn hóa và các lựa chọn giải trí ở một khu vực.", "— Tháng sau mình chuyển tới Springfield. Đời sống và các chỗ vui chơi ở đó thế nào?\n— Hay lắm! Có nhiều việc để làm vào buổi tối và cuối tuần."]}, {"title": "To show someone a good time", "ipa": "/ʃoʊ ˈsʌmˌwʌn ə ɡʊd taɪm/", "color": 0, "sid": 19, "phrase": "show you a good time", "kind": "Expression", "notes": ["To show someone a good time means to make sure he or she is entertained.", "If you come visit in December, we’ll show you a good time. All our\nfriends have parties in December!"], "extra": "", "gloss": "Dẫn ai đó đi chơi vui vẻ", "notesVi": ["“To show someone a good time” nghĩa là tiếp đãi hoặc dẫn ai đó đi chơi để họ có khoảng thời gian vui vẻ.", "Ví dụ, “Nếu bạn đến chơi vào tháng Mười Hai, bọn mình sẽ dẫn bạn đi chơi thật vui. Bạn bè bọn mình đều tổ chức tiệc vào tháng đó!”"]}, {"title": "Thanks so much", "ipa": "/θæŋks soʊ mʌtʃ/", "color": 1, "sid": 21, "phrase": "Thanks so much", "kind": "Appreciation", "notes": ["Thanks so much is a common way of expressing appreciation. Other ways to say this are Thank you very much/Thanks a lot/I really appreciate this/You’re a doll (very informal)/You’re a sweetheart (very informal). The reply to any of these could be You’re welcome/No problem/I’m glad I could help you/Glad to help/Any time."], "extra": "— Thanks so much for fixing my tire. I really appreciate it.\n— No problem.\n\n— Thank you very much for helping us.\n— You’re welcome. Any time.", "gloss": "Cảm ơn bạn nhiều lắm", "notesVi": ["“Thanks so much” là cách thường dùng để bày tỏ lòng cảm ơn. Bạn cũng có thể nói “Cảm ơn bạn rất nhiều”, “Cảm ơn nhiều”, “Mình rất trân trọng việc này” hoặc thân mật hơn là “Bạn thật tốt bụng”. Người nghe có thể đáp “Không có gì”, “Không sao đâu”, “Mình rất vui vì giúp được bạn” hoặc “Cứ cần là nói nhé”.", "— Cảm ơn bạn nhiều vì đã sửa lốp xe cho mình. Mình rất biết ơn.\n— Không có gì.", "— Cảm ơn bạn rất nhiều vì đã giúp bọn mình.\n— Không có gì. Cứ cần là nói nhé."]}, {"title": "To be in good shape", "ipa": "/bi ɪn ɡʊd ʃeɪp/", "color": 0, "sid": 22, "phrase": "in good shape", "kind": "Expression", "notes": ["To be in good shape means to be fit financially or situationally.", "My sister’s husband has a good job, so they’re in good shape\nfinancially. She has a good education and a lot of experience, so she’s in good\nshape for the job market.", "A similar expression, to be in shape, means to be physically fit.", "She exercises every day to stay in shape.\nYou look great. How do you stay in shape?"], "extra": "In the conversation, Matt expects to be feeling well again by the next day after his trip.", "gloss": "Ở tình trạng tốt / Khỏe lại", "notesVi": ["“To be in good shape” có thể nói về tình hình tài chính ổn hoặc điều kiện thuận lợi. Ví dụ, chồng chị mình có công việc tốt nên tài chính của hai người ổn định. Một người có học vấn tốt và nhiều kinh nghiệm sẽ có lợi thế khi tìm việc.", "“To be in shape” cũng là cách nói về thể lực. Hai ví dụ trong sách nghĩa là “Cô ấy tập hằng ngày để giữ dáng và giữ sức khỏe” và “Trông bạn khỏe quá. Bạn làm gì để giữ thể lực vậy?”", "Trong bài, Matt tin rằng đến ngày mai cậu ấy sẽ khỏe lại sau chuyến đi."]}, {"title": "To be looking forward to something", "ipa": "/bi ˈlʊkɪŋ ˈfɔrwɚd tə ˈsʌmθɪŋ/", "color": 1, "sid": 23, "phrase": "looking forward to", "kind": "Pattern", "notes": ["The expression looking forward to indicates that the speaker is very happy about a future event.", "I’m looking forward to seeing you on Saturday.\nShe’s really looking forward to going to college in the fall.", "Another way to say this is with the expression, can’t wait to.", "I can’t wait to see you on Saturday.\nShe can’t wait to go to college in the fall."], "extra": "", "gloss": "Mong chờ điều gì", "notesVi": ["“Looking forward to” cho thấy người nói háo hức về một sự kiện trong tương lai. Ví dụ, “Mình rất mong gặp bạn vào thứ Bảy” và “Cô ấy rất háo hức được vào đại học vào mùa thu”.", "Có thể dùng “can’t wait to” để diễn tả sự háo hức tương tự. Hai ví dụ tương ứng là “Mình nóng lòng được gặp bạn vào thứ Bảy” và “Cô ấy nóng lòng được vào đại học vào mùa thu”."]}, {"title": "To have in store for", "ipa": "/hæv ɪn stɔr fɔr/", "color": 0, "sid": 23, "phrase": "has in store for me", "kind": "Expression", "notes": ["The phrase to have in store for indicates an unknown situation that someone presents to someone else; it can be good or bad.", "Well, I’m going home, but I have no idea what my family will have\nin store for me. We’re going shopping tomorrow to see what the designers have in\nstore for us this season. He’s been working there for years, but he never knows what’s in\nstore for him until he gets there."], "extra": "", "gloss": "Có điều gì chờ đón ai đó / Đã chuẩn bị gì cho ai", "notesVi": ["“To have in store for” nói về điều sắp xảy ra hoặc điều ai đó đã chuẩn bị mà người trong cuộc chưa biết. Điều ấy có thể tốt hoặc xấu.", "“Mình đang về nhà, nhưng chẳng biết gia đình sẽ dành điều gì bất ngờ cho mình.” “Ngày mai chúng mình sẽ đi mua sắm để xem các nhà thiết kế mang đến điều gì cho mùa này.” “Anh ấy đã làm ở đó nhiều năm, nhưng chẳng bao giờ biết chuyện gì đang chờ mình cho đến khi tới nơi.”"]}, {"title": "To show up on someone’s doorstep", "ipa": "/ʃoʊ ʌp ɑn ˈsʌmˌwʌnz ˈdɔrˌstɛp/", "color": 1, "sid": 26, "phrase": "show up on your doorstep", "kind": "Expression", "notes": ["To show up on someone’s doorstep means to visit someone without notice. It doesn’t necessarily mean that you plan to stay overnight—or longer—but it’s possible.", "I was just getting ready to go out when my cousin showed up on my\ndoorstep.", "Related expressions are drop in and drop by, but these are used only for short visits—never an overnight stay.", "We were in town, so we decided to drop in to see you.\nPlease drop by for a while. I miss seeing you.", "To show up, on the other hand, is used negatively to indicate that someone often doesn’t appear when expected.", "Pia said she was coming, but you never know if she’ll show up or\nnot.", "Another meaning of show up, when used with a direct object, is to perform or seem better than someone else.", "Your singing was fantastic! You showed up all the other contestants.\nHe will show up the competition with his fantastic speech.", "She showed us all up when she came in wearing that red dress!"], "extra": "", "gloss": "Bất ngờ ghé nhà ai mà không báo trước", "notesVi": ["“To show up on someone’s doorstep” có nghĩa là đến nhà ai đó mà không báo trước. Chuyến ghé thăm có thể ngắn hoặc có thể ở lại. Ví dụ, “Mình vừa chuẩn bị ra ngoài thì người họ hàng bất ngờ xuất hiện trước cửa nhà”.", "“Drop in” và “drop by” thường chỉ việc ghé thăm ngắn. Ví dụ, “Bọn mình đang ở trong thị trấn nên quyết định ghé thăm bạn” và “Ghé qua chơi một lát nhé. Mình nhớ bạn”.", "“Show up” còn có nghĩa là xuất hiện hoặc có mặt. Ví dụ, “Pia bảo sẽ đến, nhưng chẳng biết cô ấy có xuất hiện hay không”. Khi có tân ngữ, “show someone up” có thể nghĩa là làm người khác lu mờ. Ví dụ, “Bạn hát tuyệt lắm! Bạn làm tất cả thí sinh khác lu mờ”. “Anh ấy sẽ làm các đối thủ lu mờ nhờ bài phát biểu xuất sắc”. “Cô ấy làm cả bọn lu mờ khi bước vào trong chiếc váy đỏ ấy!”"]}], "lines": [{"name": "Todd", "chunks": ["Hi—you must be", "John’s cousin", "Matt, right?"], "text": "Hi—you must be John’s cousin Matt, right?", "vi": "Chào, chắc cậu là Matt, em họ của John, đúng không?", "segments": [{"text": "Hi—you must be John’s cousin Matt, right?", "start": 4.65, "end": 8.24}], "start": 4.65, "end": 8.24}, {"name": "Todd", "chunks": ["From", "San Diego?"], "text": "From San Diego?", "vi": "Đến từ San Diego à?", "segments": [{"text": "From San Diego?", "start": 8.47, "end": 9.51}], "start": 8.47, "end": 9.51}, {"name": "Matt", "chunks": ["Correct!"], "text": "Correct!", "vi": "Đúng rồi!", "segments": [{"text": "Correct!", "start": 9.91, "end": 10.72}], "start": 9.91, "end": 10.72}, {"name": "Matt", "chunks": ["I just", "got in", "last night."], "text": "I just got in last night.", "vi": "Tớ mới đến tối qua.", "segments": [{"text": "I just got in last night.", "start": 11.02, "end": 12.5}], "start": 11.02, "end": 12.5}, {"name": "Todd", "chunks": ["I’m Todd,", "John’s roommate", "from Tech."], "text": "I’m Todd, John’s roommate from Tech.", "vi": "Tớ là Todd, bạn cùng phòng của John ở trường Tech.", "segments": [{"text": "I’m Todd, John’s roommate from Tech.", "start": 12.81, "end": 15.14}], "start": 12.81, "end": 15.14}, {"name": "Todd", "chunks": ["Glad", "to meet you."], "text": "Glad to meet you.", "vi": "Rất vui được gặp cậu.", "segments": [{"text": "Glad to meet you.", "start": 15.47, "end": 16.37}], "start": 15.47, "end": 16.37}, {"name": "Todd", "chunks": ["I can assure you that", "I’m not anything like", "what John has told you."], "text": "I can assure you that I’m not anything like what John has told you.", "vi": "Tớ đảm bảo với cậu rằng tớ chẳng giống như những gì John kể đâu.", "segments": [{"text": "I can assure you that I’m not anything like what John has told you.", "start": 16.81, "end": 20.18}], "start": 16.81, "end": 20.18}, {"name": "Matt", "chunks": ["I’m happy", "to meet you, too", "—and, yes—", "I have heard about you!"], "text": "I’m happy to meet you, too—and, yes—I have heard about you!", "vi": "Tớ cũng rất vui được gặp cậu. Và đúng là tớ có nghe kể về cậu rồi!", "segments": [{"text": "I’m happy to meet you, too—and, yes—I have heard about you!", "start": 20.43, "end": 25.12}], "start": 20.43, "end": 25.12}, {"name": "Matt", "chunks": ["Football player", "and party animal", "extraordinaire."], "text": "Football player and party animal extraordinaire.", "vi": "Một cầu thủ bóng bầu dục kiêm tay tiệc tùng có hạng.", "segments": [{"text": "Football player and party animal extraordinaire.", "start": 25.44, "end": 29.18}], "start": 25.44, "end": 29.18}, {"name": "Todd", "chunks": ["Football, yes", "—and as a matter of fact,", "I do like parties."], "text": "Football, yes—and as a matter of fact, I do like parties.", "vi": "Bóng bầu dục thì đúng rồi, mà thật ra tớ cũng thích tiệc tùng đấy.", "segments": [{"text": "Football, yes—and as a matter of fact, I do like parties.", "start": 29.5, "end": 33.73}], "start": 29.5, "end": 33.73}, {"name": "Todd", "chunks": ["But tell me", "more about yourself", "and what you do", "in San Diego."], "text": "But tell me more about yourself and what you do in San Diego.", "vi": "Nhưng kể thêm về cậu và những việc cậu làm ở San Diego đi.", "segments": [{"text": "But tell me more about yourself and what you do in San Diego.", "start": 33.99, "end": 37.3}], "start": 33.99, "end": 37.3}, {"name": "Matt", "chunks": ["Well, I’m", "more (of) a surfer", "than a football player."], "text": "Well, I’m more (of) a surfer than a football player.", "vi": "À, tớ thiên về lướt sóng hơn là chơi bóng bầu dục.", "segments": [{"text": "Well, I’m more (of) a surfer than a football player.", "start": 37.68, "end": 41.13}], "start": 37.68, "end": 41.13}, {"name": "Matt", "chunks": ["You know,", "San Diego has", "a fantastic coast", "—", "and we can", "surf all day", "and then party", "on the beach at night."], "text": "You know, San Diego has a fantastic coast—and we can surf all day and then party on the beach at night.", "vi": "Cậu biết đấy, San Diego có bờ biển tuyệt đẹp, bọn tớ có thể lướt sóng cả ngày rồi tiệc tùng trên bãi biển vào ban đêm.", "segments": [{"text": "You know, San Diego has a fantastic coast—", "start": 41.5, "end": 44.86}, {"text": "and we can surf all day and then party on the beach at night.", "start": 44.86, "end": 49.04}], "start": 41.5, "end": 49.04}, {"name": "Todd", "chunks": ["That", "sounds", "awesome."], "text": "That sounds awesome.", "vi": "Nghe tuyệt thật.", "segments": [{"text": "That sounds awesome.", "start": 49.31, "end": 50.49}], "start": 49.31, "end": 50.49}, {"name": "Todd", "chunks": ["How long", "are you", "staying?"], "text": "How long are you staying?", "vi": "Cậu ở lại bao lâu?", "segments": [{"text": "How long are you staying?", "start": 50.85, "end": 51.98}], "start": 50.85, "end": 51.98}, {"name": "Matt", "chunks": ["Well,", "I’ll be here", "for two weeks."], "text": "Well, I’ll be here for two weeks.", "vi": "À, tớ sẽ ở đây hai tuần.", "segments": [{"text": "Well, I’ll be here for two weeks.", "start": 52.5, "end": 55.04}], "start": 52.5, "end": 55.04}, {"name": "Matt", "chunks": ["John has promised me", "a nonstop schedule", "—", "kind of a mix of", "sightseeing,", "meeting his friends,", "checking out the local scene,", "and—hopefully—", "camping in the mountains", "for a couple of days."], "text": "John has promised me a nonstop schedule—kind of a mix of sightseeing, meeting his friends, checking out the local scene, and—hopefully—camping in the mountains for a couple of days.", "vi": "John hứa sẽ xếp cho tớ lịch kín mít, nào là đi tham quan, gặp bạn bè của cậu ấy, khám phá chỗ vui chơi quanh đây và hy vọng còn được cắm trại trên núi vài ngày.", "segments": [{"text": "John has promised me a nonstop schedule—", "start": 55.3, "end": 58.39}, {"text": "kind of a mix of sightseeing, meeting his friends, checking out the local scene,", "start": 58.39, "end": 63.65}, {"text": "and—hopefully—camping in the mountains for a couple of days.", "start": 63.65, "end": 67.45}], "start": 55.3, "end": 67.45}, {"name": "Todd", "chunks": ["John’s a good guy", "—and you can be sure", "he knows", "the local scene."], "text": "John’s a good guy—and you can be sure he knows the local scene.", "vi": "John là người tốt, và cậu cứ yên tâm là cậu ấy rành chỗ vui chơi ở đây.", "segments": [{"text": "John’s a good guy—and you can be sure he knows the local scene.", "start": 67.61, "end": 71.07}], "start": 67.61, "end": 71.07}, {"name": "Todd", "chunks": ["He knows", "everybody", "in town."], "text": "He knows everybody in town.", "vi": "Cậu ấy quen mọi người trong thị trấn.", "segments": [{"text": "He knows everybody in town.", "start": 71.32, "end": 72.88}], "start": 71.32, "end": 72.88}, {"name": "Todd", "chunks": ["I’m sure", "he’ll show you", "a good time."], "text": "I’m sure he’ll show you a good time.", "vi": "Tớ chắc cậu ấy sẽ dẫn cậu đi chơi vui lắm.", "segments": [{"text": "I’m sure he’ll show you a good time.", "start": 73.22, "end": 74.99}], "start": 73.22, "end": 74.99}, {"name": "Todd", "chunks": ["And his friends", "are here", "to help."], "text": "And his friends are here to help.", "vi": "Bạn bè cậu ấy cũng sẵn sàng giúp.", "segments": [{"text": "And his friends are here to help.", "start": 75.23, "end": 76.65}], "start": 75.23, "end": 76.65}, {"name": "Matt", "chunks": ["Thanks so much", "—I really", "appreciate that."], "text": "Thanks so much—I really appreciate that.", "vi": "Cảm ơn cậu nhiều, tớ rất trân trọng điều đó.", "segments": [{"text": "Thanks so much—I really appreciate that.", "start": 77.19, "end": 80.27}], "start": 77.19, "end": 80.27}, {"name": "Matt", "chunks": ["I’m still", "a bit jet-lagged", "at the moment", "but should be", "in good shape", "by tomorrow."], "text": "I’m still a bit jet-lagged at the moment but should be in good shape by tomorrow.", "vi": "Lúc này tớ vẫn hơi mệt vì lệch múi giờ, nhưng chắc mai sẽ khỏe lại.", "segments": [{"text": "I’m still a bit jet-lagged at the moment", "start": 80.65, "end": 82.99}, {"text": "but should be in good shape by tomorrow.", "start": 82.99, "end": 85.49}], "start": 80.65, "end": 85.49}, {"name": "Matt", "chunks": ["I’m looking forward to", "hearing what", "John has in store", "for me. . . ."], "text": "I’m looking forward to hearing what John has in store for me. . . .", "vi": "Tớ rất mong được nghe John đã chuẩn bị gì cho tớ…", "segments": [{"text": "I’m looking forward to hearing what John has in store for me. . . .", "start": 85.81, "end": 89.15}], "start": 85.81, "end": 89.15}, {"name": "Todd", "chunks": ["Don’t", "worry."], "text": "Don’t worry.", "vi": "Đừng lo.", "segments": [{"text": "Don’t worry.", "start": 89.35, "end": 90.12}], "start": 89.35, "end": 90.12}, {"name": "Todd", "chunks": ["We’ll all", "take good care", "of you."], "text": "We’ll all take good care of you.", "vi": "Bọn tớ sẽ chăm sóc cậu chu đáo.", "segments": [{"text": "We’ll all take good care of you.", "start": 90.21, "end": 91.77}], "start": 90.21, "end": 91.77}, {"name": "Todd", "chunks": ["And don’t be surprised", "if we show up", "on your doorstep", "in San Diego", "one day,", "ready for surfing!"], "text": "And don’t be surprised if we show up on your doorstep in San Diego one day, ready for surfing!", "vi": "Và đừng ngạc nhiên nếu một ngày bọn tớ bất ngờ ghé nhà cậu ở San Diego, sẵn sàng đi lướt sóng nhé!", "segments": [{"text": "And don’t be surprised if we show up on your doorstep", "start": 92.06, "end": 94.5}, {"text": "in San Diego one day, ready for surfing!", "start": 94.5, "end": 97.17}], "start": 92.06, "end": 97.17}]}</script>

const audio=$('audio'), play=$('play'), seek=$('seek');
let view='home', clipEnd=null, playTicket=0, frame=0, activeLine=null;
const mediaNote=text=>{$('media-error').textContent=text;$('media-error').hidden=!text};
const time=seconds=>Number.isFinite(seconds)?Math.floor(seconds/60)+':'+String(Math.floor(seconds%60)).padStart(2,'0'):'0:00';
function syncAudio(){
  seek.value=audio.currentTime;
  $('clock').value=time(audio.currentTime)+' / '+time(audio.duration||99.593);
  play.textContent=audio.paused?'▶':'❚❚';
  play.setAttribute('aria-label',audio.paused?'Play conversation':'Pause conversation');
  const now=audio.currentTime;
  const active=homeState.follow&&view==='home'&&!audio.paused?lines.findIndex(s=>now>=s.start&&now<s.end):-1;
  const next=active>=0?$('home').querySelector(`[data-line="${active}"]`):null;
  if(next!==activeLine){
    activeLine?.classList.remove('active-line');
    next?.classList.add('active-line');
    activeLine=next;
  }
}
function tick(){
  if(clipEnd!==null&&audio.currentTime>=clipEnd){
    audio.pause();
    clipEnd=null;
  }
  syncAudio();
  if(!audio.paused)frame=requestAnimationFrame(tick);
}
function stopAudio(reset=false,keepClip=false){
  playTicket++;
  if(!keepClip)clipEnd=null;
  audio.pause();
  if(reset)audio.currentTime=0;
  syncAudio();
}
async function startAudio(start,end){
  stopRecording();
  recording?.pause();
  const ticket=++playTicket;
  mediaNote('');
  audio.pause();
  clipEnd=end??null;
  try{
    if(start!==undefined){
      if(audio.error)throw new Error('Media unavailable');
      if(audio.readyState===0){
        await new Promise((resolve,reject)=>{
          const done=()=>{audio.removeEventListener('loadedmetadata',ready);audio.removeEventListener('error',failed)};
          const ready=()=>{done();resolve()};
          const failed=()=>{done();reject(new Error('Media unavailable'))};
          audio.addEventListener('loadedmetadata',ready,{once:true});audio.addEventListener('error',failed,{once:true});
        });
      }
      if(ticket!==playTicket)return;
      audio.currentTime=start;
    }
    await audio.play();
  }catch{
    if(ticket===playTicket){clipEnd=null;mediaNote('Audio could not play. Keep the MP3 in the same folder as index.html.')}
  }
}
audio.addEventListener('play',()=>{cancelAnimationFrame(frame);tick()});
audio.addEventListener('timeupdate',()=>{
  if(clipEnd!==null&&audio.currentTime>=clipEnd){audio.pause();clipEnd=null;}
});
for(const name of ['pause','loadedmetadata','seeked','ended'])audio.addEventListener(name,syncAudio);
audio.addEventListener('loadedmetadata',()=>{seek.max=audio.duration});
audio.addEventListener('error',()=>mediaNote('Audio could not load. Keep the MP3 in the same folder as index.html.'));
play.onclick=()=>audio.paused?startAudio(undefined,clipEnd):stopAudio(false,true);
$('stop').onclick=()=>stopAudio(true);
seek.oninput=()=>{clipEnd=null;audio.currentTime=+seek.value;syncAudio()};
$('rate').onchange=()=>audio.playbackRate=+$('rate').value;
const listen=part=>startAudio(part.start,part.end);
const homeState={vi:false,follow:false,words:true,palette:false,marks:lines.map(s=>Array(s.text.length).fill('')),undo:[]};
let savedSelection=null;
const glossInContext={
  'I do like parties':'mình thực sự thích tiệc tùng',
  'a mix of':'sự kết hợp của nhiều hoạt động khác nhau',
  'what you do':'những việc bạn làm',
  'in good shape':'khỏe lại, ở trạng thái tốt',
};
const words=cards.map(card=>({...card,gloss:glossInContext[card.phrase]||card.gloss})).concat([
  {phrase:'a bit jet-lagged',color:1,gloss:'hơi mệt vì lệch múi giờ'},
  {phrase:'take good care of you',color:0,gloss:'chăm sóc bạn chu đáo'},
  {phrase:'more (of) a surfer than',color:1,gloss:'thiên về lướt sóng hơn là'},
  {phrase:'you can be sure',color:0,gloss:'bạn cứ yên tâm rằng'},
  {phrase:'happy to meet you',color:1,gloss:'rất vui được gặp bạn'}
]).sort((a,b)=>b.phrase.length-a.phrase.length);
function markedSentence(text,idx){
  const lower=text.toLowerCase(), codes=Array(text.length).fill(-1);
  if(homeState.words){
    words.forEach(({phrase},wordIndex)=>{
      const target=phrase.toLowerCase();
      let i=lower.indexOf(target);
      while(i>=0){
        if((i===0||!/[a-z]/i.test(text[i-1]))&&(!text[i+target.length]||!/[a-z]/i.test(text[i+target.length]))&&codes.slice(i,i+target.length).every(n=>n===-1))codes.fill(wordIndex,i,i+target.length);
        i=lower.indexOf(target,i+target.length);
      }
    });
  }
  const manual=homeState.marks[idx];
  let html='';
  for(let i=0;i<text.length;){
    let end=i+1;
    while(end<text.length&&codes[end]===codes[i]&&manual[end]===manual[i])end++;
    const part=escapeHTML(text.slice(i,end)), klass=manual[i]?' manual-'+manual[i]:'';
    if(codes[i]>=0){
      const word=words[codes[i]];
      html+=`<mark class="${word.color===1?'green':''}${klass}" data-word="${codes[i]}" role="button" tabindex="0" aria-controls="gloss-box" aria-expanded="false">${part}</mark>`;
    }
    else html+=klass?`<span class="${klass}">${part}</span>`:part;
    i=end;
  }
  return html;
}
const glossBox=$('gloss-box');
let glossAnchor=null, glossPinned=false;
function closeGloss(){
  glossAnchor?.setAttribute('aria-expanded','false');

  glossBox.hidden=true;
}
function showGloss(anchor,pinned=false){

  closeGloss();
  glossAnchor=anchor;
  glossPinned=pinned;
  anchor.setAttribute('aria-expanded','true');
  glossBox.querySelector('strong').textContent=word.phrase;
  glossBox.querySelector('span').textContent=word.gloss;
  glossBox.hidden=false;
  const rect=anchor.getBoundingClientRect();
  const left=Math.max(10,Math.min(rect.left,window.innerWidth-glossBox.offsetWidth-10));
  const below=rect.bottom+8;
  const above=rect.top-glossBox.offsetHeight-8;
  glossBox.style.left=left+'px';
  glossBox.style.top=(below+glossBox.offsetHeight<=window.innerHeight-10?below:Math.max(10,above))+'px';
}
function toggleGloss(anchor){
  if(glossAnchor===anchor&&glossPinned)closeGloss();
  else showGloss(anchor,true);
}
const reading=$('home');
reading.addEventListener('pointerover',event=>{
  const mark=event.target.closest('[data-word]');
  if(mark&&event.pointerType==='mouse'&&!glossPinned)showGloss(mark);
});
reading.addEventListener('pointerout',event=>{
  if(event.target.closest('[data-word]')===glossAnchor&&!glossPinned)closeGloss();
});
reading.addEventListener('focusin',event=>{
  const mark=event.target.closest('[data-word]');
  if(mark&&mark.matches(':focus-visible'))showGloss(mark);
});
reading.addEventListener('focusout',event=>{
  if(event.target===glossAnchor)closeGloss();
});
reading.addEventListener('click',event=>{
  const mark=event.target.closest('[data-word]');
  if(mark&&!getSelectionRanges())toggleGloss(mark);
});
document.addEventListener('click',event=>{
  if(glossAnchor&&!event.target.closest('[data-word]'))closeGloss();
});
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'&&glossAnchor){closeGloss();return}
  const mark=event.target.closest?.('[data-word]');
  if(mark&&(event.key==='Enter'||event.key===' ')){event.preventDefault();toggleGloss(mark)}
});
window.addEventListener('scroll',closeGloss,{passive:true});
window.addEventListener('resize',closeGloss);
function renderHome(){
  closeGloss();
  let dialogue='';
  for(let i=0;i<lines.length;){
    const name=lines[i].name, label=`<span class="speaker ${name.toLowerCase()}">${name.toUpperCase()}</span>`;
    const eng=[],vi=[];
    do{
      eng.push(`<span data-line="${i}">${markedSentence(lines[i].text,i)}</span>`);
      vi.push(escapeHTML(lines[i].vi));
      i++;
    }while(lines[i]?.name===name);
    dialogue+=`<div class="turn"><div class="en">${label}${eng.join(' ')}</div>${homeState.vi?`<p class="translation" lang="vi">${vi.join(' ')}</p>`:''}</div>`;
  }
  $('home').innerHTML=`<div class="row tools"><button data-home="follow" aria-pressed="${homeState.follow}">▶ Chạy chữ · ${homeState.follow?'ON':'OFF'}</button><button data-home="words" aria-pressed="${homeState.words}">✓ Highlights</button><button data-home="vi" aria-pressed="${homeState.vi}">VI · ${homeState.vi?'ON':'OFF'}</button><button data-home="palette" aria-pressed="${homeState.palette}">Tô màu</button></div>
  ${homeState.palette?`<div class="row tools palette" aria-label="Highlight selected dialogue text"><button data-paint="yellow">Vàng</button><button data-paint="green">Xanh</button><button data-paint="pink">Hồng</button><button data-paint="erase">Xóa vùng chọn</button><button data-paint="undo" ${homeState.undo.length?'':'disabled'}>Hoàn tác</button><button data-paint="clear">Xóa hết màu tô</button></div>`:''}
  <article class="dialogue" aria-label="Conversation transcript">${dialogue}</article>`;
  syncAudio();
}
function getSelectionRanges(){
  const selection=window.getSelection();
  if(!selection?.rangeCount||selection.isCollapsed)return null;
  const range=selection.getRangeAt(0);
  if(!$('home').contains(range.startContainer)||!$('home').contains(range.endContainer))return null;
  const spans=[];
  document.querySelectorAll('#home [data-line]').forEach(el=>{
    if(!range.intersectsNode(el))return;
    const i=Number(el.dataset.line);
    function offset(node,point,fallback){
      if(!el.contains(node))return fallback;
      const prefix=document.createRange();
      prefix.selectNodeContents(el);
      prefix.setEnd(node,point);
      return prefix.toString().length;
    }
    const a=offset(range.startContainer,range.startOffset,0);
    const b=offset(range.endContainer,range.endOffset,lines[i].text.length);
    if(a<b)spans.push([i,a,b]);
  });
  return spans.length?spans:null;
}
document.addEventListener('selectionchange',()=>{
  if(view==='home'){
    const spans=getSelectionRanges();
    if(spans)savedSelection=spans;
  }
});
$('home').addEventListener('pointerdown',event=>{
  if(event.target.closest('[data-paint]'))event.preventDefault();
  else if(event.target.closest('.dialogue'))savedSelection=null;
});
$('home').onclick=event=>{
  const button=event.target.closest('button');
  if(!button)return;
  const key=button.dataset.home;
  if(key){homeState[key]=!homeState[key];renderHome();return}
  const paint=button.dataset.paint;
  if(!paint)return;
  if(paint==='undo'){
    if(homeState.undo.length)homeState.marks=homeState.undo.pop();
  }else{
    const ranges=getSelectionRanges()||savedSelection;
    if(paint!=='clear'&&!ranges)return;
    homeState.undo.push(homeState.marks.map(m=>m.slice()));
    if(paint==='clear')homeState.marks.forEach(m=>m.fill(''));
    else ranges.forEach(([i,a,b])=>homeState.marks[i].fill(paint==='erase'?'':paint,a,b));
  }
  savedSelection=null;
  window.getSelection()?.removeAllRanges();
  renderHome();
};
const partList=lines.flatMap((line,sid)=>line.segments.map((part,index)=>({...part,sid,index})));
const sentence={mode:'build',idx:0,selected:[],order:[],done:{build:new Set(),listen:new Set()}};
function shuffle(items){
  const result=items.slice();
  for(let i=result.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [result[i],result[j]]=[result[j],result[i]];
  }
  return result;
}
function getPractice(){
  const isBuild=sentence.mode==='build';
  const part=isBuild?lines[sentence.idx]:partList[sentence.idx];
  const sid=isBuild?sentence.idx:part.sid;
  return {isBuild,part,sid,line:lines[sid],size:isBuild?lines.length:partList.length};
}
function resetChunks(){
  const n=getPractice().line.chunks.length, ids=Array.from({length:n},(_,i)=>i);
  sentence.selected=[];
  sentence.order=shuffle(ids);
  if(n>1&&sentence.order.every((id,i)=>id===i))sentence.order.push(sentence.order.shift());
}
const buildChunk=(line,id,area)=>`<button data-chunk="${id}" data-area="${area}">${escapeHTML(line.chunks[id])}</button>`;
function drawChunks(){
  const line=getPractice().line;
  $('built').innerHTML=sentence.selected.map(id=>buildChunk(line,id,'selected')).join('')||'<span class="subtle">Tap chunks to build the sentence.</span>';
  $('bank').innerHTML=sentence.order.filter(id=>!sentence.selected.includes(id)).map(id=>buildChunk(line,id,'bank')).join('');
}
function renderSentence(){
  const {isBuild,part,sid,line,size}=getPractice();
  const done=sentence.done[sentence.mode].size;
  $('sentence').innerHTML=`<div class="row"><button data-mode="build" aria-pressed="${isBuild}">1 · Build with chunks</button><button data-mode="listen" aria-pressed="${!isBuild}">2 · Listen &amp; type</button></div>
  <div class="panel"><div class="row practice-header"><div><strong>Sentence ${sid+1}/${lines.length}</strong> ${!isBuild&&line.segments.length>1?`· Part ${part.index+1}/${line.segments.length}`:''} <span class="status-tag">${line.name}</span></div>
  <select id="sentence-choice" aria-label="Choose sentence">${lines.map((_,i)=>`<option value="${i}" ${i===sid?'selected':''}>${i+1}</option>`).join('')}</select></div>
  <progress class="progress" id="practice-progress" value="${done}" max="${size}" aria-label="Practice progress"></progress>
  <div class="row tools"><button data-action="listen">▶ Listen to ${isBuild||line.segments.length===1?'sentence':'this part'}</button><button data-action="stop">■ Stop</button></div>
  ${isBuild?'<div class="tray" id="built" aria-label="Selected chunks"></div><div class="row chunks" id="bank" aria-label="Chunk bank"></div>':'<textarea id="typed" class="typing" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Type what you hear" placeholder="Type what you hear…"></textarea>'}
  <div class="row"><button data-action="prev" ${sentence.idx===0?'disabled':''}>Back</button><button data-action="check" class="primary">Check</button><button data-action="next" ${sentence.idx+1===size?'disabled':''}>Next</button><span class="subtle" id="practice-count">${done} / ${size} completed</span></div>
  <div class="row tools"><button data-action="hint">Hint</button><button data-action="clear">Clear</button><button data-action="answer">Show Answer</button><button data-action="vi">Show Vietnamese</button></div>
  <div id="sentence-feedback" class="feedback" role="status"></div><div id="sentence-hint" class="feedback" hidden></div><div id="sentence-answer" class="feedback answerline" hidden></div><p id="sentence-vi" class="translation" lang="vi" hidden></p></div>`;
  if(isBuild)drawChunks();
  $('sentence-choice').onchange=event=>{
    const target=+event.target.value;
    changePractice(isBuild?target:partList.findIndex(p=>p.sid===target));
  };
}
function changePractice(index){
  stopAudio();
  sentence.idx=index;
  resetChunks();
  renderSentence();
}
const normalized=text=>text.normalize('NFKC').toLowerCase().replace(/\(of\)/g,'of').replace(/[’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function showPractice(id,button,text,on,off){
  const elem=$(id);
  elem.textContent=text;
  elem.hidden=!elem.hidden;
  button.textContent=elem.hidden?off:on;
  button.setAttribute('aria-expanded',String(!elem.hidden));
}
$('sentence').onclick=event=>{
  const button=event.target.closest('button');
  if(!button)return;
  const {mode,chunk,area,action}=button.dataset;
  const {isBuild,part,line,size}=getPractice();
  if(mode&&mode!==sentence.mode){
    sentence.mode=mode;
    changePractice(0);
  }
  if(chunk!==undefined){
    if(area==='selected')sentence.selected=sentence.selected.filter(id=>id!==+chunk);
    else sentence.selected.push(+chunk);
    $('sentence-feedback').textContent='';
    drawChunks();
  }
  if(action==='prev'||action==='next')changePractice(sentence.idx+(action==='prev'?-1:1));
  if(action==='listen')listen(part);
  if(action==='stop')stopAudio();
  if(action==='clear')changePractice(sentence.idx);
  if(action==='vi')showPractice('sentence-vi',button,line.vi,'Hide Vietnamese','Show Vietnamese');
  if(action==='answer')showPractice('sentence-answer',button,part.text,'Hide Answer','Show Answer');
  if(action==='hint')showPractice('sentence-hint',button,`Starts with “${isBuild?line.chunks[0]:part.text.split(' ').slice(0,2).join(' ')}”`,'Hide Hint','Hint');
  if(action==='check'){
    const typed=isBuild?null:normalized($('typed').value);
    const expected=normalized(part.text);
    const acceptable=typed===expected||(part.text.includes('(of)')&&typed===normalized(part.text.replace('(of) ','')));
    const success=isBuild?sentence.selected.length===line.chunks.length&&sentence.selected.map(id=>line.chunks[id]).join(' ')===line.chunks.join(' '):acceptable;
    if(success)sentence.done[sentence.mode].add(sentence.idx);
    const result=$('sentence-feedback');
    result.className='feedback '+(success?'correct':'wrong');
    result.textContent=success?'Correct!':isBuild?'The order does not match the source sentence yet.':'Try again. Check the words and their order.';
    const done=sentence.done[sentence.mode].size;
    $('practice-progress').value=done;
    $('practice-count').textContent=`${done} / ${size} completed`;
  }
};
const review={idx:0,filter:'all',revealed:false,order:cards.map((_,i)=>i),status:new Map()};
const cardSet=()=>review.order.filter(id=>review.filter==='all'||(review.status.get(id)||'new')===review.filter);
function renderCards(){
  const items=cardSet(), id=items[review.idx], card=cards[id];
  $('cards').innerHTML=`<div class="row practice-header"><h2>Review Cards</h2><div class="row"><select id="card-filter" aria-label="Filter cards"><option value="all">All cards</option><option value="new">Unmarked</option><option value="again">Needs review</option><option value="known">Remembered</option></select><button data-card="shuffle">Shuffle</button><button data-card="reset">Reset cards</button></div></div>
  ${card?`<div class="panel"><div class="card-front"><div class="row subtle"><span>${review.idx+1} / ${items.length}</span><span class="status-tag">${escapeHTML(card.kind)}</span></div><h3>${escapeHTML(card.title)}</h3><button data-card="flip" class="primary" aria-expanded="${review.revealed}">${review.revealed?'Hide explanation':'Show explanation'}</button></div>
  ${review.revealed?`<div class="card-back" lang="en"><p class="ipa">${escapeHTML(card.ipa)}</p>${card.notes.map(p=>`<p>${escapeHTML(p)}</p>`).join('')}${card.extra?`<div class="note-extra">${escapeHTML(card.extra)}</div>`:''}<div class="example"><span class="subtle">In the conversation · ${lines[card.sid].name}</span><p>${escapeHTML(lines[card.sid].text)}</p><button data-card="listen">▶ Listen to source sentence</button></div><details class="card-translation" lang="vi"><summary><span class="translation-show">Hiện bản dịch tiếng Việt</span><span class="translation-hide">Ẩn bản dịch tiếng Việt</span></summary><p class="meaning-head">${escapeHTML(card.gloss)}</p>${card.notesVi.map(p=>`<p>${escapeHTML(p)}</p>`).join('')}<h4>Trong hội thoại · ${lines[card.sid].name}</h4><p>${escapeHTML(lines[card.sid].vi)}</p></details></div>`:''}
  <div class="row card-actions"><button data-card="prev" ${review.idx===0?'disabled':''}>Previous</button><button data-card="next" ${review.idx+1===items.length?'disabled':''}>Next</button><button data-card="again" aria-pressed="${review.status.get(id)==='again'}">Needs review</button><button data-card="known" aria-pressed="${review.status.get(id)==='known'}">Remembered</button></div></div>`:'<div class="panel">No cards match this filter.</div>'}`;
  $('card-filter').value=review.filter;
  $('card-filter').onchange=event=>{stopAudio();review.filter=event.target.value;review.idx=0;review.revealed=false;renderCards()};
}
function resetCards(){
  review.idx=0;
  review.filter='all';
  review.revealed=false;
  review.order=cards.map((_,i)=>i);
  review.status.clear();
}
$('cards').onclick=event=>{
  const action=event.target.closest('button')?.dataset.card;
  if(!action)return;
  const items=cardSet(), id=items[review.idx];
  if(action==='listen'){listen(lines[cards[id].sid]);return}
  stopAudio();
  if(action==='flip')review.revealed=!review.revealed;
  else{
    review.revealed=false;
    if(action==='prev'||action==='next')review.idx+=action==='prev'?-1:1;
    if(action==='shuffle'){review.order=shuffle(review.order);review.idx=0}
    if(action==='reset')resetCards();
    if(action==='again'||action==='known'){
      review.status.set(id,action);
      review.idx=Math.max(0,Math.min(review.idx,cardSet().length-1));
    }
  }
  renderCards();
  if(action==='flip')$('cards').querySelector('[data-card="flip"]')?.focus();
};
const role={name:'Todd',idx:0,show:false};
let recorder=null, recording=null, recordingURL='', requestID=0, recordingAt=0, timer=null;
const roleLines=()=>lines.map((line,i)=>({...line,i})).filter(line=>line.name===role.name);
function stopRecording(){
  requestID++;
  if(recorder?.state==='recording')recorder.stop();
  clearInterval(timer);
}
function clearRecording(){
  stopRecording();
  recorder=null;
  recording?.pause();
  recording=null;
  if(recordingURL)URL.revokeObjectURL(recordingURL);
  recordingURL='';
}
function renderSpeak(){
  const items=roleLines(), item=items[role.idx], prev=lines[item.i-1];
  $('speak').innerHTML=`<h2>Speak</h2><div class="row"><button data-role="Todd" aria-pressed="${role.name==='Todd'}">Speak as Todd</button><button data-role="Matt" aria-pressed="${role.name==='Matt'}">Speak as Matt</button></div>
  <div class="panel"><p class="subtle">${role.name} · Line ${role.idx+1} / ${items.length}</p>
  ${prev&&prev.name!==role.name?`<div class="example"><strong>${prev.name}</strong><p>${escapeHTML(prev.text)}</p><button data-speak="cue">▶ Listen to cue</button></div>`:''}
  <div class="row"><button data-speak="show" aria-expanded="${role.show}">${role.show?'Hide your line':'Show your line'}</button><button data-speak="model">▶ Listen to your line</button></div>
  ${role.show?`<p class="role-line">${escapeHTML(item.text)}</p>`:''}
  <div class="row"><button data-speak="prev" ${role.idx===0?'disabled':''}>Back</button><button class="primary" id="record" data-speak="record">● Record</button><button id="end-record" data-speak="stop" disabled>■ Stop recording</button><button data-speak="next" ${role.idx+1===items.length?'disabled':''}>Next</button><span id="record-time" class="recording"></span></div>
  <div id="record-status" class="feedback" role="status"></div><audio id="recording-player" controls hidden></audio></div>`;
  recording=$('recording-player');
  recording.onplay=()=>stopAudio();
  if(recordingURL){recording.src=recordingURL;recording.hidden=false}
}
async function record(){
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
    $('record-status').textContent='Microphone recording requires a supported browser on HTTPS or localhost.';
    return;
  }
  stopAudio();
  clearRecording();
  recording=$('recording-player');
  recording.removeAttribute('src');
  recording.hidden=true;
  const token=++requestID;
  $('record').disabled=true;
  $('record-status').textContent='Allow microphone access to start recording.';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if(token!==requestID||view!=='speak'){
      stream.getTracks().forEach(track=>track.stop());
      if(view==='speak'&&requestID===token+1)$('record').disabled=false;
      return;
    }
    try{recorder=new MediaRecorder(stream)}
    catch(error){stream.getTracks().forEach(track=>track.stop());throw error}
    const current=recorder, chunks=[];
    current.ondataavailable=event=>{if(event.data.size)chunks.push(event.data)};
    current.onstop=()=>{
      stream.getTracks().forEach(track=>track.stop());
      if(current!==recorder||view!=='speak')return;
      recordingURL=URL.createObjectURL(new Blob(chunks,{type:current.mimeType}));
      recording.src=recordingURL;
      recording.hidden=false;
      $('record').disabled=false;
      $('end-record').disabled=true;
      $('record-status').textContent='Recording ready to play.';
    };
    current.start();
    recordingAt=Date.now();
    $('end-record').disabled=false;
    $('record-status').textContent='';
    $('record-time').textContent='0:00';
    timer=setInterval(()=>{$('record-time').textContent=time((Date.now()-recordingAt)/1000)},250);
  }catch{
    if(token===requestID&&view==='speak'){
      $('record').disabled=false;
      $('record-status').textContent='Microphone access is unavailable. Check the browser’s permission and try again.';
    }
  }
}
$('speak').onclick=event=>{
  const button=event.target.closest('button');
  if(!button)return;
  const action=button.dataset.speak, name=button.dataset.role;
  const item=roleLines()[role.idx];
  if(action==='record'){record();return}
  if(action==='stop'){stopRecording();return}
  if(action==='model'){listen(item);return}
  if(action==='cue'){listen(lines[item.i-1]);return}
  if(name||action==='prev'||action==='next'){
    stopAudio();clearRecording();
    if(name){role.name=name;role.idx=0}
    else role.idx+=action==='prev'?-1:1;
    role.show=false;
    renderSpeak();
  }
  if(action==='show'){
    role.show=!role.show;
    const existing=$('speak').querySelector('.role-line');
    if(role.show){
      const p=document.createElement('p');p.className='role-line';p.textContent=item.text;
      button.parentElement.after(p);
    }else existing?.remove();
    button.textContent=role.show?'Hide your line':'Show your line';
    button.setAttribute('aria-expanded',String(role.show));
  }
};
function navigate(next){
  closeGloss();
  stopAudio();
  if(next!==view&&view==='speak')clearRecording();
  savedSelection=null;
  view=next;
  for(const id of ['home','sentence','speak','cards'])$(id).hidden=id!==view;
  document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));
  if(view==='home')renderHome();
  if(view==='sentence'){resetChunks();renderSentence()}
  if(view==='speak')renderSpeak();
  if(view==='cards'){review.revealed=false;renderCards()}
  window.scrollTo(0,0);
}
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{if(button.dataset.view!==view)navigate(button.dataset.view)});
$('lesson').onclick=()=>navigate('home');
$('reset-all').onclick=()=>{
  stopAudio(true);clearRecording();
  Object.assign(homeState,{vi:false,follow:false,words:true,palette:false,marks:lines.map(s=>Array(s.text.length).fill('')),undo:[]});
  sentence.mode='build';sentence.idx=0;sentence.done.build.clear();sentence.done.listen.clear();
  resetCards();
  Object.assign(role,{name:'Todd',idx:0,show:false});
  audio.playbackRate=1;$('rate').value='1';
  navigate('home');
};
renderHome();
</script>
